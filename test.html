<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <!-- Lead Capture Modal (blur-underlay until form submit) -->
<section id="vv-lead-modal" class="vv-lead" aria-modal="true" role="dialog">
  <div class="vv-lead-dialog">
    <h3 class="vv-lead-title">Welcome 👋</h3>

    <form id="vv-lead-form" autocomplete="on" novalidate>
      <label class="vv-field">
        <span>Name</span>
        <input type="text" name="name" placeholder="Your name" required>
      </label>

      <label class="vv-field">
        <span>Contact Number</span>
        <input type="tel" name="phone" placeholder="10-digit mobile" inputmode="numeric"
               pattern="^[6-9]\d{9}$" required>
      </label>

      <label class="vv-field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>

      <button type="submit" class="vv-btn">Submit</button>
      <p class="vv-note">We’ll never share your info.</p>
    </form>
  </div>

  <style>
    /* Overlay */
    .vv-lead{
      position:fixed; inset:0; z-index:99999;
      display:grid; place-items:center;
      background:rgba(2,6,23,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Dialog */
    .vv-lead-dialog{
      width:min(92vw, 480px);
      padding:20px 18px;
      border-radius:18px;
      border:1px solid rgba(2,6,23,.10);
      background:#fff;
      box-shadow:0 20px 60px rgba(2,6,23,.15);
    }

    .vv-lead-title{
      margin:4px 6px 12px;
      font-weight:800;
      background:linear-gradient(90deg,#17c964,#6A4C93);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      font-size:clamp(20px,3.6vw,26px);
    }

    .vv-field{display:block; margin:10px 6px}
    .vv-field span{display:block; margin:0 0 6px; opacity:.7}
    .vv-field input{
      width:100%; padding:12px 14px; border-radius:12px;
      border:1px solid rgba(2,6,23,.15); outline:none;
      transition:border .2s, box-shadow .2s;
    }
    .vv-field input:focus{
      border-color:#17c964;
      box-shadow:0 0 0 3px rgba(23,201,100,.15)
    }

    .vv-btn{
      width:100%; margin:12px 6px 6px; padding:12px 14px;
      border:0; border-radius:12px; cursor:pointer;
      background:linear-gradient(90deg,#17c964,#6A4C93);
      color:#fff; font-weight:700;
      transition:transform .05s ease, filter .2s ease;
    }
    .vv-btn:active{ transform:scale(.99) }
    .vv-btn:hover{ filter:brightness(1.03) }

    .vv-note{margin:6px; font-size:12px; opacity:.7}

    /* Mobile spacing */
    @media (max-width:480px){
      .vv-lead-dialog{ padding:16px 14px; border-radius:16px }
    }

    /* Prevent page scroll while modal open */
    .vv-modal-open{ overflow:hidden }
  </style>

  <script>
    (function(){
      const modal = document.getElementById('vv-lead-modal');
      const form  = document.getElementById('vv-lead-form');
      const KEY   = 'vvLeadDone';

      function showModal(){
        modal.style.display = 'grid';
        document.body.classList.add('vv-modal-open');
      }
      function hideModal(){
        modal.style.display = 'none';
        document.body.classList.remove('vv-modal-open');
      }

      // Show on first visit (until submitted)
      if (!localStorage.getItem(KEY)) {
        showModal();
      } else {
        hideModal();
      }

      // Block closing by clicking outside (force fill)
      modal.addEventListener('click', (e)=>{
        const within = e.target.closest('.vv-lead-dialog');
        if (!within) e.stopPropagation(); // do nothing
      }, true);

      // Handle submit
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();

        // Basic HTML validation
        if (!form.reportValidity()) return;

        // TODO: send data to your backend endpoint
        // Example:
        // await fetch('/api/lead', { method:'POST', headers:{'Content-Type':'application/json'},
        //   body: JSON.stringify(Object.fromEntries(new FormData(form))) });

        // On success:
        localStorage.setItem(KEY, '1');
        hideModal();
      });
    })();
  </script>
</section>

  
</body>
</html>
